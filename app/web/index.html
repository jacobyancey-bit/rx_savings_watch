<!DOCTYPE html>
<html>
<head>

    If you are serving your web app in a path other than the root, change the
    href value below to reflect the base path you are serving from.

    The path provided below has to start and end with a slash "/" in order for

    For more details:
    * https://developer.mozilla.org/en-US/docs/Web/HTML/Element/base

    This is a placeholder for base href that will be replaced by the value of

  <meta charset="UTF-8">

  <meta name="description" content="Rx Savings Watch — Free, zero-login prescription and supplement tracker with live FDA generic availability, shortage alerts, and private on-device reminders.">

  <meta name='impact-site-verification' value='7ead2ffa-0588-44f1-91b7-b3b35e759492'>

  <!-- Open Graph / Social Link Preview (LinkedIn, Facebook, Reddit, Discord, iMessage) -->

  <meta property="og:url" content="https://rx.dangling-dice-studios.com/">
  <meta property="og:site_name" content="Rx Savings Watch">
  <meta property="og:title" content="Rx Savings Watch — Private Prescription & Generic Savings Tracker">
  <meta property="og:description" content="Free, no-login tool that checks live FDA & CMS data for real generic availability and shortages, tracks prescriptions & supplements, and supports caregiver cabinets strictly on your device.">

  <meta property="og:image:width" content="1200">
  <meta property="og:image:height" content="630">
  <meta property="og:image:alt" content="Rx Savings Watch — Track Prescriptions, Supplements & Real FDA Generic Savings">

  <meta name="twitter:card" content="summary_large_image">
  <meta name="twitter:title" content="Rx Savings Watch — Private Prescription & Generic Savings Tracker">
  <meta name="twitter:description" content="Free, zero-login prescription & supplement tracker with live FDA generic savings checks and caregiver cabinets. Zero personal data collected.">
  <meta name="twitter:image" content="https://rx.dangling-dice-studios.com/og-preview.png">

  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black">
  <meta name="apple-mobile-web-app-title" content="Rx Savings Watch">
  <link rel="apple-touch-icon" href="icons/Icon-192.png">

  <!-- Favicon -->
  <link rel="icon" type="image/png" href="favicon.png"/>

  <title>Rx Savings Watch</title>
  <link rel="manifest" href="manifest.json">
</head>

  <script src="rx_push_bridge.js?v=3"></script>
