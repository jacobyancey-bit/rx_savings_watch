<!DOCTYPE html>
<html lang="en">
<head>
  <base href="$FLUTTER_BASE_HREF">

  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="referrer" content="no-referrer">
  <meta content="IE=Edge" http-equiv="X-UA-Compatible">
  <meta name="description" content="Rx Savings Watch — Free, zero-login prescription and supplement tracker with live FDA generic availability, shortage alerts, and private on-device reminders.">
  <meta name="theme-color" content="#FAF9F6" media="(prefers-color-scheme: light)">
  <meta name="theme-color" content="#0A0B0B" media="(prefers-color-scheme: dark)">
  <meta name='impact-site-verification' value='08c59bd5-6680-43a0-b456-cd67700b62eb'>

  <!-- Open Graph / Social Link Preview (LinkedIn, Facebook, Reddit, Discord, iMessage) -->
  <meta property="og:type" content="website">
  <meta property="og:url" content="https://rx.dangling-dice-studios.com/">
  <meta property="og:site_name" content="Rx Savings Watch">
  <meta property="og:title" content="Rx Savings Watch — Private Prescription & Generic Savings Tracker">
  <meta property="og:description" content="Free, no-login tool that checks live FDA & CMS data for real generic availability and shortages, tracks prescriptions & supplements, and supports caregiver cabinets strictly on your device.">
  <meta property="og:image" content="https://rx.dangling-dice-studios.com/og-preview.jpg">
  <meta property="og:image:width" content="1200">
  <meta property="og:image:height" content="630">
  <meta property="og:image:alt" content="Rx Savings Watch — Track Prescriptions, Supplements & Real FDA Generic Savings">

  <!-- Twitter / X Card -->
  <meta name="twitter:card" content="summary_large_image">
  <meta name="twitter:title" content="Rx Savings Watch — Private Prescription & Generic Savings Tracker">
  <meta name="twitter:description" content="Free, zero-login prescription & supplement tracker with live FDA generic savings checks and caregiver cabinets. Zero personal data collected.">
  <meta name="twitter:image" content="https://rx.dangling-dice-studios.com/og-preview.jpg">

  <!-- iOS meta tags & icons -->
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="default">
  <meta name="apple-mobile-web-app-title" content="Rx Savings Watch">
  <link rel="apple-touch-icon" href="icons/Icon-192.png">

  <!-- Favicon -->
  <link rel="icon" type="image/png" href="favicon.png"/>

  <title>Rx Savings Watch</title>
  <link rel="manifest" href="manifest.json">

  <style>
    :root {
      --canvas: #FAF9F6;
      --surface: #FFFFFF;
      --ink: #11181C;
      --muted: #59636E;
      --border: #E5E4E0;
      --brand: #0F5132;
      --mono: ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, monospace;
      --sans: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
    }
    @media (prefers-color-scheme: dark) {
      :root {
        --canvas: #0A0B0B;
        --surface: #121414;
        --ink: #EDEDEF;
        --muted: #9CA3AF;
        --border: #232726;
        --brand: #34D399;
      }
    }
    * { box-sizing: border-box; }
    html, body {
      margin: 0;
      padding: 0;
      height: 100%;
      background-color: var(--canvas);
      color: var(--ink);
      font-family: var(--sans);
      -webkit-font-smoothing: antialiased;
    }

    /* Architectural Boot Shell — disappears automatically once Flutter mounts */
    #rx-boot-shell {
      position: fixed;
      inset: 0;
      display: flex;
      flex-direction: column;
      background: var(--canvas);
      z-index: 9999;
      transition: opacity 180ms ease-out;
    }
    .boot-header {
      height: 57px;
      border-bottom: 1px solid var(--border);
      padding: 0 24px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      font-size: 14px;
      font-weight: 600;
    }
    .boot-brand {
      display: inline-flex;
      align-items: center;
      gap: 10px;
    }
    .boot-mark {
      background: var(--brand);
      color: #FFFFFF;
      font-family: var(--mono);
      font-size: 11px;
      font-weight: 700;
      padding: 3px 7px;
      border-radius: 5px;
      letter-spacing: 0.05em;
    }
    .boot-body {
      flex: 1;
      display: flex;
      align-items: center;
      justify-content: center;
      flex-direction: column;
      gap: 12px;
      padding: 24px;
      text-align: center;
    }
    .boot-kicker {
      font-family: var(--mono);
      font-size: 11px;
      letter-spacing: 0.08em;
      text-transform: uppercase;
      color: var(--muted);
    }
    .boot-bar {
      width: 140px;
      height: 2px;
      background: var(--border);
      overflow: hidden;
      border-radius: 2px;
    }
    .boot-bar::after {
      content: "";
      display: block;
      width: 45%;
      height: 100%;
      background: var(--brand);
      animation: rx-boot-slide 1.1s ease-in-out infinite;
    }
    @keyframes rx-boot-slide {
      0% { transform: translateX(-100%); }
      100% { transform: translateX(260%); }
    }
  </style>
</head>
<body>
  <div id="rx-boot-shell" aria-label="Loading Rx Savings Watch">
    <div class="boot-header">
      <span class="boot-brand">
        <span class="boot-mark">RX</span>
        <span>Rx Savings Watch</span>
      </span>
      <span class="boot-kicker">Private &bull; Local-First</span>
    </div>
    <div class="boot-body">
      <div class="boot-kicker">Loading Medication Cabinet</div>
      <div class="boot-bar"></div>
    </div>
  </div>
  <script>
    window.addEventListener('flutter-first-frame', function () {
      var el = document.getElementById('rx-boot-shell');
      if (el) {
        el.style.opacity = '0';
        setTimeout(function () { if (el.parentNode) el.parentNode.removeChild(el); }, 200);
      }
    });
  </script>
  <script src="rx_push_bridge.js?v=3"></script>
  <script src="flutter_bootstrap.js" async></script>
</body>
</html>
