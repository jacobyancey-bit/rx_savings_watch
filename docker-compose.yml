services:
  rx-savings-server:
    build:
      context: ./server
      dockerfile: Dockerfile
    container_name: rx_savings_watch_server
    restart: unless-stopped
    ports:
      - "3000:3000"
    environment:
      - NODE_ENV=production
      - PORT=3000
      - DB_PATH=/app/data/rx_savings.db
    volumes:
      - ./server/data:/app/data
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:3000/health"]
      interval: 30s
      timeout: 5s
      retries: 3
